# ══════════════════════════════════════════════════════════════
# HezCast — Nginx Configuration
# Generated by deploy/nginx_generator.py
# Domain: hezcast.com
# ══════════════════════════════════════════════════════════════

# Global security settings
server_tokens off;

# ── HTTP → HTTPS redirect (all subdomains) ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hezcast.com www.hezcast.com api.hezcast.com app.hezcast.com admin.hezcast.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → apex redirect ─────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hezcast.com;

    ssl_certificate     /etc/letsencrypt/live/hezcast.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hezcast.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hezcast.com$request_uri;
}

# ── Landing page: hezcast.com ──────────────────────────────────
# Serves static files or proxies to Vercel
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hezcast.com;

    ssl_certificate     /etc/letsencrypt/live/hezcast.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hezcast.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy to Vercel (or serve static files)
    location / {
        proxy_pass         https://hezcast-saas.vercel.app;
        proxy_set_header   Host hezcast-saas.vercel.app;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
    }
}

