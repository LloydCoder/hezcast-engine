# ── FastAPI Backend: api.hezcast.com ───────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hezcast.com;

    ssl_certificate     /etc/letsencrypt/live/hezcast.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hezcast.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # CORS headers for API consumers
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Handle CORS preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Rate limiting (protect from abuse)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req zone=api burst=10 nodelay;

    # Proxy to FastAPI
    location / {
        proxy_pass         http://127.0.0.1:8503;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        client_max_body_size 100M;
    }

    # Health check — no rate limit
    location /health {
        proxy_pass       http://127.0.0.1:8503/health;
        proxy_set_header Host $host;
        limit_req_status 429;
    }
}

# ── Admin Panel: admin.hezcast.com (IP-RESTRICTED) ─────────────
# ⚠️  ONLY accessible from your IP address
# Never expose this to the public internet
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.hezcast.com;

    ssl_certificate     /etc/letsencrypt/live/hezcast.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hezcast.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ⚠️  IP RESTRICTION — CRITICAL SECURITY CONTROL
    # Only your IP can access admin
    allow YOUR_IP_HERE;
    deny  all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # Do not index admin in search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass         http://127.0.0.1:8503;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Admin-Request "true";
        proxy_read_timeout 300;
    }
}

